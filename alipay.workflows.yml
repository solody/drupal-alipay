payment_alipay:
  id: payment_alipay
  group: commerce_payment
  label: 'Alipay'
  states:
    new:
      label: 'New'
    pending:
      label: 'Pending'
    completed:
      label: 'Completed'
    partially_refunded:
      label: 'Partially refunded'
    refunded:
      label: 'Refunded'
    voided:
      label: 'Voided'
  transitions:
    create:
      label: 'Create payment'
      from: [new]
      to: pending
    receive:
      label: 'Receive payment'
      from: [pending, new]
      to: completed
    partially_refund:
      label: 'Partially refund payment'
      from: [completed]
      to: partially_refunded
    refund:
      label: 'Refund payment'
      from: [completed, partially_refunded]
      to: refunded
    void:
      label: 'Void payment'
      from: [pending]
      to: voided
